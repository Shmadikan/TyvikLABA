services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kubsu
      POSTGRES_PASSWORD: kubsu
      POSTGRES_DB: kubsu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubsu"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ТВОЙ_DOCKERHUB_ЛОГИН/kubsu-app:latest
    ports:
      - "8042:8042"
    environment:
      DATABASE_URL: postgresql+psycopg://kubsu:kubsu@db:5432/kubsu
      PORT: "8042"
    depends_on:
      db:
        condition: service_healthy